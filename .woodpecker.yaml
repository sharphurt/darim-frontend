when:
  - event: [push, manual]
    branch: main

# Keep production workflows in pipeline creation order, including the
# shared Coolify commit pin. Supported by the installed Woodpecker 3.20.1.
concurrency:
  limit: 1
  group: frontend-release

steps:
  - name: lint-and-build
    image: node:24-bookworm-slim
    commands:
      - npm ci
      - npm test
      - npm run lint
      - npm run build

  - name: test-telegram-release
    depends_on: [lint-and-build]
    image: alpine:3.22
    commands:
      - apk add --no-cache nodejs git
      - node --test ops/tests/telegram-release.integration.mjs

  - name: read-production-revision
    depends_on: [test-telegram-release]
    image: alpine:3.22
    failure: ignore
    commands:
      - apk add --no-cache curl jq
      - |
        response=$(curl -fsS --max-time 10 https://wishes.hype-ny.ru/frontend-release.json) || response='{}'
        printf '%s\n' "$response" | jq -r '.commit // empty' > .previous-production
    when:
      - event: push
        branch: main

  - name: deploy-production
    depends_on: [read-production-revision]
    image: node:24-bookworm-slim
    environment:
      COOLIFY_TOKEN:
        from_secret: coolify_token
    commands:
      - node ops/deploy-production.mjs
    when:
      - event: push
        branch: main

  - name: telegram-frontend-release
    depends_on: [deploy-production]
    image: alpine:3.22
    failure: ignore
    environment:
      TELEGRAM_BOT_TOKEN:
        from_secret: telegram_bot_token
      TELEGRAM_LICKREAL_ID:
        from_secret: telegram_lickreal_id
      TELEGRAM_SHARPHURT_ID:
        from_secret: telegram_sharphurt_id
    commands:
      - apk add --no-cache curl jq git
      - git fetch --unshallow origin || git fetch origin
      - sh ops/telegram-ci.sh release
    when:
      - event: push
        branch: main
        status: [success]

  - name: telegram-pipeline-failure
    image: alpine:3.22
    failure: ignore
    environment:
      TELEGRAM_BOT_TOKEN:
        from_secret: telegram_bot_token
      TELEGRAM_LICKREAL_ID:
        from_secret: telegram_lickreal_id
      TELEGRAM_SHARPHURT_ID:
        from_secret: telegram_sharphurt_id
    commands:
      - apk add --no-cache curl jq
      - sh ops/telegram-ci.sh failure
    when:
      - status: [failure]
