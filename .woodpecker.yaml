when:
  - event: [push, manual]
    branch: [main, test]

# Keep test-and-deploy workflows in pipeline creation order, including the
# shared Coolify commit pin. Supported by the installed Woodpecker 3.20.1.
concurrency:
  limit: 1
  group: frontend-release

steps:
  - name: lint-and-build
    image: node:24-bookworm-slim
    commands:
      - npm ci
      - npm test
      - npm run lint
      - npm run build

  - name: deploy-test
    depends_on: [lint-and-build]
    image: alpine:3.22
    environment:
      COOLIFY_DEPLOY_WEBHOOK:
        from_secret: coolify_test_deploy_webhook
      COOLIFY_TOKEN:
        from_secret: coolify_token
    commands:
      - apk add --no-cache curl jq
      - |
        test -n "$COOLIFY_DEPLOY_WEBHOOK" && test -n "$COOLIFY_TOKEN" || {
          echo 'Configure coolify_test_deploy_webhook and coolify_token in Woodpecker' >&2
          exit 1
        }
        response=$(curl --fail --silent --show-error --max-time 30 \
          --request POST --proto '=https' \
          --header "Authorization: Bearer $COOLIFY_TOKEN" \
          --header 'Accept: application/json' \
          "$COOLIFY_DEPLOY_WEBHOOK")
        printf '%s\n' "$response" |
          jq -er '.deployments[0].deployment_uuid | select(type == "string" and length > 0)'
    when:
      - event: push
        branch: test

  - name: deploy-production
    depends_on: [lint-and-build]
    image: node:24-bookworm-slim
    environment:
      COOLIFY_TOKEN:
        from_secret: coolify_token
    commands:
      - node ops/deploy-production.mjs
    when:
      - event: push
        branch: main
