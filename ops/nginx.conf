server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /frontend-release.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Production Caddy routes these paths directly to ASP.NET on the same origin.
    # Never serve the SPA for an API/auth request if the edge route is missing.
    location ~ ^/(api|auth)(/|$) {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
