map $http_x_forwarded_proto $darim_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Keep API/auth on the browser's origin, including cookies and OIDC callbacks.
    location ~ ^/(api|auth)/ {
        proxy_pass ${DARIM_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $darim_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache off;
        proxy_redirect off;
        client_max_body_size 25m;
    }

    location / {
        try_files $uri /index.html;
    }
}
